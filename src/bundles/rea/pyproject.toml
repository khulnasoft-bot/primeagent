[project]
name = "wfx-rea"
version = "0.1.0"
description = "REA reverse-engineering components for Primeagent WFX"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = ["wfx>=1.13.0.dev0,<2.0.0"]

[project.urls]
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-rea = "wfx_rea"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_rea"]
include = ["src/wfx_rea/extension.json", "src/wfx_rea/*.py", "src/wfx_rea/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src/wfx_rea", "examples/", "README.md", "pyproject.toml"]